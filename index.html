<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="Replayer Betclic · SpinScope"><meta property="og:description" content="Rejoue une main Betclic depuis son screenshot, et partage-la en un lien.">
<title>Replayer SpinScope</title>
<style>:root{
  --bg:#0a0a0b; --side:#0f0f11; --panel:#151517; --panel2:#1b1b1e; --panel3:#222226; --border:#26262b; --border2:#33333a;
  --text:#f4f4f5; --muted:#9b9ba3; --dim:#6b6b73;
  --cream:#f4ecd8; --creamText:#1a1712; --orange:#f5a524; --orange2:#e8891a;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --yellow:#eab308; --cyan:#0ea5e9; --purple:#a855f7;
  --radius:12px;
  font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2b2b31;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.drag{-webkit-app-region:drag}.nodrag{-webkit-app-region:no-drag}
#app{display:flex;height:100vh}
/* sidebar */
.side{width:212px;flex:none;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px 12px}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand svg{flex:none}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.4px;margin-top:1px}
.modes{display:flex;gap:6px;padding:0 4px 14px}
.modes span{padding:5px 11px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted);border:1px solid transparent}
.modes span.on{color:var(--orange);border-color:var(--orange);background:rgba(245,165,36,.08)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--panel3);color:var(--text)}
.nav svg{width:16px;height:16px;flex:none}
.side .grow{flex:1}
.side .foot{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.dbinfo{font-size:11px;color:var(--dim);padding:2px 10px 6px;line-height:1.5}
.btn-import{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--orange);color:var(--orange);background:rgba(245,165,36,.07);padding:9px;border-radius:10px;font-weight:600}
.btn-import:hover{background:rgba(245,165,36,.15)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.titlebar{height:34px;flex:none}
.scroll{flex:1;overflow:auto;padding:4px 18px 22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px 14px;text-align:center;cursor:default;position:relative}
.kpi.sel{background:linear-gradient(180deg,#25221c,#1a1814);border-color:#4a4335}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--dim);margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pos{color:var(--green)}.neg{color:var(--red)}
.kpis2{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpis2 .kpi{padding:9px 10px 10px}.kpis2 .kpi .v{font-size:18px}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pills{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px}
.pills button{background:none;border:0;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12px}
.pills button.on{background:var(--cream);color:var(--creamText)}
.pills.sm button{padding:4px 9px;font-size:11px}
.toolbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:12px;color:var(--text);font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--border2)}
.chip .x{color:var(--dim);margin-left:2px;font-size:13px;line-height:1}
.chip .x:hover{color:var(--text)}
.chip.on{border-color:#4a4335;background:#1f1c16}
/* cards */
.grid{display:grid;gap:12px}
.g-stats{grid-template-columns:1.25fr 1fr}
table.t.cmp th,table.t.cmp td{padding:9px 7px}
table.t.cmp td .sub{display:block;margin-left:0;font-size:10.5px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0;display:flex;flex-direction:column}
.card h3{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:28px;flex-wrap:wrap}
.card .hd .sp{flex:1}
.help{width:16px;height:16px;border-radius:50%;border:1px solid var(--border2);color:var(--muted);font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:help;position:relative;font-weight:700}
.help:hover .tip{display:block}
.tip{display:none;position:absolute;left:20px;top:-6px;z-index:50;width:290px;background:#0d0d0f;border:1px solid var(--border2);padding:10px 12px;border-radius:9px;font-weight:400;font-size:12px;color:#d4d4d8;line-height:1.5;text-transform:none;letter-spacing:0;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.chart{width:100%;height:300px}
.chart.tall{height:calc(100vh - 230px);min-height:380px}
.chart.mid{height:250px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{background:none;border:0;padding:4px 9px;border-radius:6px;font-size:11px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
select.sel{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;outline:none}
/* tables */
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 10px;border-bottom:1px solid #1f1f23;text-align:right;white-space:nowrap}
table.t tr:hover td{background:#19191c}
table.t tr.tot td{font-weight:700;border-top:1px solid var(--border2)}
table.t td .sub{color:var(--dim);font-size:11px;margin-left:6px}
table.t tr.click{cursor:pointer}
.twrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tag.R{background:rgba(239,68,68,.12);color:#f87171}.tag.F{background:rgba(59,130,246,.13);color:#60a5fa}
.tagbtns{display:inline-flex;gap:3px}
.tagbtns button{border:1px solid var(--border);background:var(--panel2);padding:2px 7px;border-radius:6px;font-size:11px;color:var(--muted)}
.tagbtns button.on.R{border-color:#7f1d1d;color:#f87171;background:rgba(239,68,68,.1)}
.tagbtns button.on.F{border-color:#1e3a8a;color:#60a5fa;background:rgba(59,130,246,.1)}
.tagbtns button.on.A{border-color:var(--border2);color:var(--text)}
/* donuts */
.donuts{display:flex;flex-direction:column;align-items:center;gap:6px}
.donrow{display:flex;justify-content:space-around;width:100%;gap:10px;flex-wrap:wrap}
.don{display:flex;flex-direction:column;align-items:center;gap:4px}
.don .cap{font-weight:600;font-size:12px}
.qrow{display:flex;align-items:center;gap:12px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px}
.legend b{font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:60px 20px;color:var(--muted)}
.empty h2{color:var(--text);margin:0;font-size:20px}
.drop{border:1.5px dashed var(--border2);border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted);transition:.15s;background:var(--panel)}
.drop.over{border-color:var(--orange);background:rgba(245,165,36,.05);color:var(--text)}
.drop b{color:var(--text)}
.bigbtn{background:var(--cream);color:var(--creamText);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.ghost{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-weight:600;font-size:12px}
.ghost:hover{border-color:var(--border2)}
.ghost.danger{color:#f87171}
.progress{height:6px;background:var(--panel3);border-radius:6px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange2),var(--orange));width:0;transition:width .2s}
.luck{display:flex;align-items:center;gap:8px;font-size:12px}
.luck .ic{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.luck small{display:block;color:var(--dim);font-size:11px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.lg span.off{opacity:.35}
.lg i{width:12px;height:3px;border-radius:2px;display:inline-block}
.form{display:grid;grid-template-columns:220px 1fr;gap:12px 16px;align-items:center;max-width:720px}
.form label{color:var(--muted)}
.form input[type=number],.form input[type=text],.form input[type=date]{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:160px;outline:none}
.note{color:var(--dim);font-size:12px;line-height:1.55}
.hh{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;background:#0d0d0f;border:1px solid var(--border);border-radius:10px;padding:12px 14px;max-height:520px;overflow:auto;color:#d4d4d8}
.cd{display:inline-block;padding:0 3px;border-radius:4px;background:#f5f5f4;color:#111;font-weight:700;margin:0 1px;font-family:inherit}
.cd.h{color:#dc2626}.cd.d{color:#2563eb}.cd.c{color:#16a34a}.cd.s{color:#111}
.pop{position:fixed;z-index:100;background:#111113;border:1px solid var(--border2);border-radius:12px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.6);min-width:240px}
.pop h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.pop .opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pop .opts button{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:12px}
.pop .opts button.on{background:var(--cream);color:var(--creamText);border-color:var(--cream)}
.pop input[type=date]{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
.toast{position:fixed;right:18px;bottom:18px;background:#141416;border:1px solid var(--border2);border-radius:12px;padding:12px 16px;z-index:200;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.search{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 11px;width:240px;outline:none}
.mini{font-size:11px;color:var(--dim)}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--panel3);color:var(--muted);font-weight:600}
@media (max-width:1400px){.g-stats{grid-template-columns:1fr}.kpis2{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}}
.kpi .rbin{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.kpi .rbin input{width:52px;background:#0d0d0f;border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:2px 5px;font:inherit;font-size:11.5px;text-align:center}
.kpi .rbin input:focus{outline:none;border-color:#f5a524}
.kpi .rbin .sepd{opacity:.5}
.seg.money{margin-left:10px}
.seg.money button{display:inline-flex;align-items:center;gap:6px}
.oppsel{display:flex;align-items:center;gap:4px}
.search.sm{width:190px;padding:6px 10px;font-size:12px}
.ghost.xs{padding:4px 9px;font-size:13px;line-height:1}
.don .cap{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.t.pl{font-size:12.5px}
table.t.pl td .sub{display:inline;margin-left:4px}
table.t.pl .tagbtns button{padding:3px 7px}
.kpi.toggle{cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.kpi.toggle:hover{border-color:#3b82f6;background:#15171c}
.kpi.toggle.isev:hover{border-color:#a855f7;background:#18151c}
.kpi.toggle .swap{font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--border2);border-radius:6px;padding:1px 6px;margin-left:6px;letter-spacing:0}
.kpi.toggle:hover .swap{color:#fafafa}
.plbar{gap:8px;flex-wrap:wrap;margin-top:-4px}
.plbar .dl{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.plbar input[type=date]{background:#0d0d0f;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;color-scheme:dark}
.ghost.xs2{padding:5px 10px;font-size:12px}
.vsep{width:1px;height:20px;background:var(--border2);margin:0 4px}
.note.rule{margin-bottom:10px}.note.rule b.F{color:#60a5fa}.note.rule b.R{color:#f87171}
.utag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);vertical-align:1px;white-space:nowrap}
.taglist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:260px;overflow:auto;min-width:260px}
.tagrow{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}.tagrow .utag{margin-left:0}.tagrow .sp{flex:1}
.newtag{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.newtag input{background:#0d0d0f;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px}
.newtag .cols{display:flex;gap:6px}.cdot{width:16px;height:16px;border-radius:50%;cursor:pointer;opacity:.6;outline-offset:2px}.cdot.on{opacity:1;outline:2px solid #fafafa}
.tagbtns button.U{padding:3px 6px}
.ghost.danger{color:#f87171}
/* ---- hand search ---- */
.hfil{margin-bottom:12px}
.hfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
.hfgrid label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hfgrid .sel,.inp{width:100%;text-transform:none;letter-spacing:0;font-weight:500}
.inp{background:#0d0d0f;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px}
.inp:focus{outline:none;border-color:#f5a524}
.hfbtns{display:flex;gap:8px;align-items:center;margin-top:12px}
.bdc{display:inline-flex;align-items:center;gap:0}.bdc i{width:6px}
.aitag{font-size:9.5px;font-weight:700;color:#f5a524;border:1px solid rgba(245,165,36,.4);border-radius:4px;padding:0 4px;margin-left:3px}
.play{color:var(--muted);font-size:11px}tr.click:hover .play{color:#f5a524}
.bigbtn.xs{padding:5px 12px;font-size:12px;margin-right:6px}
/* ---- replayer ---- */
.rpov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.rp{background:#111113;border:1px solid var(--border2);border-radius:16px;width:min(1040px,100%);max-height:100%;overflow:auto;padding:16px 18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.rphd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.rpt{font-weight:700;font-size:15px}.rphd .sp{flex:1}
.rpchk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.felt{background:#0b0b0d;border-radius:14px;padding:26px 30px}
.rail{position:relative;height:400px;border-radius:200px;background:radial-gradient(ellipse at center,#1d3a2c 0%,#15291f 55%,#0f1c16 100%);border:10px solid #1c1a17;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 0 0 1px #2c2822}
.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.pot{font-size:13px;font-weight:700;color:#f4ecd8;background:rgba(0,0,0,.35);padding:3px 12px;border-radius:999px;min-height:22px}.pot.empty{background:none}
.plate .pos{font-size:10px;font-weight:700;color:#a1a1aa;border:1px solid #3f3f46;border-radius:5px;padding:0 5px;margin-left:5px;vertical-align:1px}
.board{display:flex;gap:6px}
.pc{width:46px;height:64px;border-radius:7px;background:#fafaf7;color:#18181b;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.45);font-family:'Segoe UI',sans-serif}
.pc b{font-size:21px;font-weight:800}.pc i{font-style:normal;font-size:20px}
.pc.h,.pc.d{color:#dc2626}.pc.d{color:#2563eb}.pc.c{color:#16a34a}.pc.s{color:#18181b}
.pc.back{background:repeating-linear-gradient(45deg,#e8711a 0 6px,#c85a10 6px 12px);border:2px solid #fafaf7}
.pc.slot{background:rgba(255,255,255,.04);box-shadow:none;border:1px dashed rgba(255,255,255,.12)}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .2s}
.seat.bottom{left:50%;bottom:-34px;transform:translateX(-50%)}
.seat.top{left:50%;top:-40px;transform:translateX(-50%)}
.seat.left{left:-10px;top:30px}
.seat.right{right:-10px;top:30px}
.seat .cards{display:flex;gap:3px;min-height:64px}
.seat .cards .pc{width:42px;height:58px}.seat .cards .pc b{font-size:19px}
.seat.fold .cards,.seat.fold .plate{opacity:.35}
.plate{background:#0f0f11;border:1px solid #2e2e34;border-radius:10px;padding:5px 14px;min-width:130px;text-align:center}
.seat.act .plate{border-color:#f5a524;box-shadow:0 0 0 2px rgba(245,165,36,.25)}
.seat.winner .plate{border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.25)}
.plate .nm{font-size:12.5px;font-weight:700;white-space:nowrap}.plate .stk{font-size:13px;color:#f4ecd8;font-variant-numeric:tabular-nums}
.dotc{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}.dotc.R{background:#ef4444}.dotc.F{background:#3b82f6}
.bubble{position:absolute;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#27272a;color:#fafafa;white-space:nowrap}
.bubble.a{background:#e8711a}.bubble.f{background:#3f3f46;color:#a1a1aa}.bubble.w{background:#16a34a}
.seat.bottom .bubble{top:-26px}.seat.top .bubble{bottom:-26px}.seat.left .bubble,.seat.right .bubble{bottom:-26px}
.eqb{position:absolute;white-space:nowrap;font-size:12px;font-weight:800;color:#0b0b0d;background:#f4ecd8;padding:2px 8px;border-radius:6px}
.seat.bottom .eqb{right:-64px;top:20px}.seat.top .eqb{right:-64px;bottom:10px}.seat.left .eqb{left:150px;top:8px}.seat.right .eqb{right:150px;top:8px}

<script>
// Betclic.fr Spin & Rush hand-history parser.
// Output hand: { id, gid, tid, ts, tsEnd, game, mode, buyin, prize, mult, sb, bb, pot, rake,
//   seats:[{n, st, hero, btn, sb, bb, c}], acts:[{st, p, t, a, to, ai}], board, sd, won:[], fin:[{p, place, prize}], raw }
// Action types: S=post SB, B=post BB, F=fold, X=check, C=call(a=increment), K=bet(a), R=raise(to=total street amount)

const ACT_RE = /^(\d\d):(\d\d):(\d\d) - (.+?): (Posts SB|Posts BB|Folds|Checks|Calls|Bets|Raises to|Sits out|Sits in|Disconnected|Reconnected)(?: (\d+))?( and is all-in)?$/;
const SEAT_RE = /^Seat (\d+): (.*) \((\d+)\) \[([^\]]*)\]$/;
const STREETS = { 'PRE-FLOP': 0, 'FLOP': 1, 'TURN': 2, 'RIVER': 3 };
const IGNORED = new Set(['Sits out', 'Sits in', 'Disconnected', 'Reconnected']);
const TYPES = { 'Posts SB': 'S', 'Posts BB': 'B', 'Folds': 'F', 'Checks': 'X', 'Calls': 'C', 'Bets': 'K', 'Raises to': 'R' };

const RANKS = '23456789TJQKA', SUITS = 'cdhs';
/** 'Ah' -> rank*4+suit (rank 0..12 = 2..A) */
function cardToInt(c) {
  const r = RANKS.indexOf(c[0].toUpperCase()), s = SUITS.indexOf(c[1].toLowerCase());
  if (r < 0 || s < 0) throw new Error('carte invalide ' + c);
  return r * 4 + s;
}
function intToCard(i) { return RANKS[i >> 2] + SUITS[i & 3]; }
const num = (s) => parseFloat(String(s).replace(/\s/g, '').replace(',', '.').replace(/[^\d.\-]/g, ''));

function parseHand(raw) {
  const lines = raw.split(/\r?\n/);
  const h = {
    id: '', gid: '', tid: '', ts: 0, tsEnd: 0, game: '', mode: '', site: '', buyin: 0, prize: 0, mult: 1,
    sb: 0, bb: 0, pot: 0, rake: 0, seats: [], acts: [], board: [], sd: false, won: [], fin: [], raw, warn: []
  };
  let sec = 'HEADER', street = -1, day0 = 0, lastSec = -1;
  const idx = new Map();
  const seatOf = (name) => idx.get(name);
  for (const l0 of lines) {
    const l = l0.trim();
    if (!l || l.startsWith('------')) continue;
    if (l.startsWith('***')) {
      const m = /^\*\*\* ([A-Z\- ]+?) \*\*\*(?: \[([^\]]*)\])?/.exec(l);
      if (!m) continue;
      sec = m[1];
      if (sec in STREETS) { street = STREETS[sec]; if (m[2]) h.board = m[2].split(/\s+/).filter(Boolean).map(cardToInt); }
      if (sec === 'SHOWDOWN') h.sd = true;
      if (sec === 'PLAYERS') h.seats.forEach((p, i) => idx.set(p.n, i));
      continue;
    }
    if (sec === 'HEADER') {
      const i = l.indexOf(': '); if (i < 0) continue;
      const k = l.slice(0, i), v = l.slice(i + 2).trim();
      if (k === 'Site') h.site = v;
      else if (k === 'Game Mode') h.mode = v;
      else if (k === 'Game Name') h.game = v;
      else if (k === 'Game ID') h.gid = v;
      else if (k === 'Prize pool') h.prize = num(v);
      else if (k === 'Multiplier') h.mult = num(v.replace(/x/i, ''));
      else if (k === 'Buy In') h.buyin = num(v);
      else if (k === 'Hand ID') h.id = v;
      else if (k === 'Table ID') h.tid = v;
      else if (k === 'Date & Time') {
        const d = /(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)/.exec(v);
        if (d) { h.ts = Date.UTC(+d[1], +d[2] - 1, +d[3], +d[4], +d[5], +d[6]); day0 = Date.UTC(+d[1], +d[2] - 1, +d[3]); }
      } else if (k === 'Blinds') { const b = v.split('/'); h.sb = num(b[0]); h.bb = num(b[1]); }
      else if (k === 'Total Pot') h.pot = num(v);
      else if (k === 'Rake') h.rake = num(v);
    } else if (sec === 'PLAYERS') {
      const m = SEAT_RE.exec(l);
      if (m) {
        const t = m[4].split(/\s+/);
        h.seats.push({ seat: +m[1], n: m[2], st: +m[3], hero: t.includes('Hero'), btn: t.includes('BTN'), sb: t.includes('SB'), bb: t.includes('BB'), c: null });
        idx.set(m[2], h.seats.length - 1);
      } else h.warn.push('seat? ' + l);
    } else if (sec === 'HOLE CARDS') {
      const m = /^(.*): \[([^\]]+)\]$/.exec(l);
      if (m && idx.has(m[1])) h.seats[idx.get(m[1])].c = m[2].split(/\s+/).map(cardToInt);
    } else if (sec in STREETS) {
      const m = ACT_RE.exec(l);
      if (!m) { h.warn.push('action? ' + l); continue; }
      // end timestamp (handles midnight rollover)
      let t = day0 + ((+m[1]) * 3600 + (+m[2]) * 60 + (+m[3])) * 1000;
      if (t < h.ts - 3600e3) t += 86400e3;
      if (t > h.tsEnd) h.tsEnd = t;
      if (IGNORED.has(m[5])) { if (m[5] === 'Disconnected' || m[5] === 'Sits out') { const q = seatOf(m[4]); if (q !== undefined) (h.away = h.away || []).push(q); } continue; }
      const p = seatOf(m[4]);
      if (p === undefined) { h.warn.push('unknown player ' + l); continue; }
      const t2 = TYPES[m[5]];
      const amt = m[6] ? +m[6] : 0;
      const a = { st: street, p, t: t2, a: t2 === 'R' ? 0 : amt, ai: !!m[7] };
      if (t2 === 'R') a.to = amt;
      h.acts.push(a);
    } else if (sec === 'SUMMARY') {
      let m;
      if ((m = /^(.*) wins (?:the )?(?:main pot|\d+\w* side pot|pot) of (\d+)$/.exec(l))) {
        const p = seatOf(m[1]);
        if (p === undefined) h.warn.push('unknown winner ' + l); else h.won[p] = (h.won[p] || 0) + (+m[2]);
      } else if ((m = /^(.*) finished (\d+)\w*(?: and wins ([\d.,\s]+)\s*(?:EUR|€))?$/.exec(l))) {
        const p = seatOf(m[1]);
        if (p === undefined) h.warn.push('unknown finisher ' + l);
        else h.fin.push({ p, place: +m[2], prize: m[3] ? num(m[3]) : 0 });
      } else h.warn.push('summary? ' + l);
    }
    lastSec = sec;
  }
  for (let i = 0; i < h.seats.length; i++) h.won[i] = h.won[i] || 0;
  if (!h.tsEnd) h.tsEnd = h.ts;
  return h;
}

/** Raw chips put in the pot per seat (blinds + calls + bets + raises). */
function contributions(h) {
  const n = h.seats.length, total = new Array(n).fill(0);
  let streetPut = new Array(n).fill(0), cur = -1;
  for (const a of h.acts) {
    if (a.st !== cur) { cur = a.st; streetPut = new Array(n).fill(0); }
    const add = a.t === 'R' ? a.to - streetPut[a.p] : a.a;
    streetPut[a.p] += add; total[a.p] += add;
  }
  return total;
}

/** Uncalled excess per street (largest street contribution minus the second largest). */
function uncalled(h) {
  const n = h.seats.length, ref = new Array(n).fill(0);
  const byStreet = [0, 1, 2, 3].map(() => new Array(n).fill(0));
  const seen = [false, false, false, false];
  for (const a of h.acts) {
    const sp = byStreet[a.st]; seen[a.st] = true;
    sp[a.p] += a.t === 'R' ? a.to - sp[a.p] : a.a;
  }
  for (let s = 0; s < 4; s++) {
    if (!seen[s]) continue;
    const sp = byStreet[s];
    let top = -1, first = -Infinity, second = 0;
    for (let i = 0; i < n; i++) {
      if (sp[i] > first) { second = first === -Infinity ? 0 : first; first = sp[i]; top = i; }
      else if (sp[i] > second) second = sp[i];
    }
    if (top >= 0 && first > second) ref[top] += first - second;
  }
  return ref;
}

/**
 * Chip accounting for a hand.
 *  eff[i]   = chips really at risk (contribution minus uncalled excess when Betclic excludes it from the pot)
 *  refund[i]= uncalled chips given back outside the pot
 *  net[i]   = chips won/lost in the hand (stack after - stack before)
 * Betclic puts an uncalled bet in "Total Pot" when the hand ends with a fold, but leaves
 * the unmatched part of an all-in out of it. We detect which case applies from the summary.
 */
function handChips(h) {
  if (h._chips) return h._chips;
  const n = h.seats.length;
  const c = contributions(h);
  const unc = uncalled(h);
  const raw = c.reduce((s, v) => s + v, 0);
  const wonSum = h.won.reduce((s, v) => s + v, 0);
  const uncSum = unc.reduce((s, v) => s + v, 0);
  let refund;
  if (wonSum === raw) refund = new Array(n).fill(0);
  else if (wonSum === raw - uncSum) refund = unc;
  else {
    // fallback: refund only what is needed to balance (should never happen on clean data)
    refund = unc.map(v => v ? Math.min(v, raw - wonSum) : 0);
    h.warn && h.warn.push(`chip balance mismatch won=${wonSum} raw=${raw} unc=${uncSum}`);
  }
  const eff = c.map((v, i) => v - refund[i]);
  const net = h.won.map((w, i) => (w || 0) - eff[i]);
  h._chips = { contrib: c, refund, eff, net };
  return h._chips;
}

/** Parse one export file. */
function parseFile(text, name = '') {
  const hands = [], errors = [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const parts = text.split(/^\*\*\* HEADER \*\*\*\s*$/m);
  for (const part of parts) {
    if (!part.trim()) continue;
    const raw = '*** HEADER ***\n' + part.replace(/\s*-{6,}\s*$/, '').trim() + '\n';
    try {
      const h = parseHand(raw);
      if (!h.id || !h.seats.length) { errors.push({ file: name, msg: 'main incomplète', snippet: raw.slice(0, 300) }); continue; }
      const hc = handChips(h);
      if (h.won.reduce((s, v) => s + v, 0) !== h.pot) h.warn.push('total pot mismatch');
      if (hc.net.reduce((s, v) => s + v, 0) !== 0) h.warn.push('chips not conserved');
      for (const w of h.warn) errors.push({ file: name, msg: w, snippet: raw.slice(0, 300), id: h.id });
      delete h.warn;
      hands.push(h);
    } catch (e) {
      errors.push({ file: name, msg: String(e && e.message || e), snippet: raw.slice(0, 300) });
    }
  }
  return { hands, errors };
}

// Exact 7-card hand evaluator + exhaustive equity enumeration with side pots.
// Cards: rank*4+suit, rank 0..12 (2..A), suit 0..3.

const RANK_KEYS = [0, 1, 5, 22, 98, 453, 2031, 8698, 22854, 83661, 262349, 636345, 1479181];
let RANK_TABLE = null;   // Uint16Array indexed by sum of rank keys (non-flush strength)
let FLUSH_TABLE = null;  // Uint16Array indexed by 13-bit rank mask (flush/straight-flush strength)
let CAT_OF = null;       // strength index -> category 0..8

function raw5(cat, ks) { // ks: up to 5 ranks high->low
  let v = cat;
  for (let i = 0; i < 5; i++) v = v * 16 + (ks[i] !== undefined ? ks[i] + 1 : 0);
  return v;
}
function straightHigh(mask) { // highest straight top rank or -1
  for (let top = 12; top >= 4; top--) {
    const m = 0x1f << (top - 4);
    if ((mask & m) === m) return top;
  }
  if ((mask & 0x100f) === 0x100f) return 3; // wheel A2345
  return -1;
}
function rawFromCounts(cnt) {
  let mask = 0; for (let r = 0; r < 13; r++) if (cnt[r]) mask |= 1 << r;
  const quads = [], trips = [], pairs = [], singles = [];
  for (let r = 12; r >= 0; r--) {
    if (cnt[r] === 4) quads.push(r); else if (cnt[r] === 3) trips.push(r); else if (cnt[r] === 2) pairs.push(r); else if (cnt[r] === 1) singles.push(r);
  }
  if (quads.length) {
    const k = [...trips, ...pairs, ...singles, ...quads.slice(1)].sort((a, b) => b - a)[0];
    return raw5(7, [quads[0], k]);
  }
  if (trips.length >= 2 || (trips.length && pairs.length)) {
    const t = trips[0];
    const p = Math.max(trips.length > 1 ? trips[1] : -1, pairs.length ? pairs[0] : -1);
    return raw5(6, [t, p]);
  }

function rpStop() { if (RP.timer) { clearInterval(RP.timer); RP.timer = null; } const b = $('#rp_play'); if (b) b.textContent = '▶'; }
function rpToggle() {
  if (RP.timer) { rpStop(); return; }
  if (RP.step >= RP.steps.length - 1) RP.step = 0;
  $('#rp_play').textContent = '❚❚';
  RP.timer = setInterval(async () => {
    if (RP.step < RP.steps.length - 1) rpGo(RP.step + 1);
    else if ($('#rp_auto') && $('#rp_auto').checked && RP.i < RP.ids.length - 1) { const t = RP.timer; RP.timer = null; clearInterval(t); await loadRpHand(+1); rpToggle(); }
    else rpStop();
  }, RP.speed);
}

function drawTable() {
  const body = $('#rp_body'); if (!body) return;
  const ph = RP.ph;
  if (RP.txt) { body.innerHTML = `<div class="hh rptxt">${esc(RP.raw)}</div>`; return; }
  const s = RP.steps[RP.step]; if (!s) return;
  const sc = $('#rp_scrub'); if (sc) sc.value = RP.step;
  const n = ph.seats.length, hero = ph.seats.findIndex(p => p.hero);
  // seat layout: hero at the bottom, others clockwise by seat number
  const order = ph.seats.map((p, i) => i).sort((a, b) => ((ph.seats[a].seat - ph.seats[hero].seat + 10) % 10) - ((ph.seats[b].seat - ph.seats[hero].seat + 10) % 10));
  const POS = n === 2 ? ['bottom', 'top'] : ['bottom', 'left', 'right'];
  const posOf = {}; order.forEach((idx, k) => { posOf[idx] = POS[k]; });
  const posName = (p) => p.btn && p.sb ? 'BTN/SB' : p.btn ? 'BTN' : p.sb ? 'SB' : p.bb ? 'BB' : '';
  const seats = ph.seats.map((p, i) => {
    const showCards = p.c && (p.hero || s.show[i] || RP.showAll);
    const cls = S.cls ? S.cls(p.n) : 'F';
    const eq = s.done && !s.win && s.eq && s.eq[i] !== undefined && (s.show[i] || RP.showAll || p.hero) ? s.eq[i] : null;
    return `<div class="seat ${posOf[i]} ${s.folded[i] ? 'fold' : ''} ${s.actor === i ? 'act' : ''} ${s.win && s.win[i] ? 'winner' : ''}">
      <div class="cards">${showCards ? p.c.map(c => bigCard(c)).join('') : (s.folded[i] ? '' : bigCard(null, true) + bigCard(null, true))}</div>
      <div class="plate"><div class="nm">${p.hero ? '' : `<span class="dotc ${cls}"></span>`}${esc(p.n)}${p.hero && p.n !== 'Héros' ? ` <span class="mini">(${RP.heroLabel || 'toi'})</span>` : ''}</div>
        <div class="stk">${s.allin[i] && s.stacks[i] === 0 && !s.win ? 'ALL-IN' : rpAmt(s.stacks[i], ph.bb)} ${posName(p) ? `<span class="pos">${posName(p)}</span>` : ''}</div></div>
      ${s.label[i] ? `<div class="bubble ${/Fold/.test(s.label[i]) ? 'f' : /Gagne/.test(s.label[i]) ? 'w' : /All-in|Raise|Bet/.test(s.label[i]) ? 'a' : ''}">${s.label[i]}</div>` : ''}
      ${eq !== null ? `<div class="eqb">${nf(eq * 100, 1)} %</div>` : ''}
      ${p.btn ? '<div class="dbtn">D</div>' : ''}
      ${s.bets[i] ? `<div class="bet"><span class="bchip"></span>${rpAmt(s.bets[i], ph.bb)}</div>` : ''}
    </div>`;
  }).join('');
  const board = ph.board.slice(0, s.boardN);
  body.innerHTML = `<div class="felt"><div class="rail">
      <div class="center"><div class="pot ${s.pot ? '' : 'empty'}">${s.pot ? 'Pot ' + rpAmt(s.pot, ph.bb) : ''}</div>
      <div class="board">${[0, 1, 2, 3, 4].map(k => board[k] !== undefined ? bigCard(board[k]) : '<div class="pc slot"></div>').join('')}</div></div>
      ${seats}</div></div>
    <div class="rpmsg">${esc(s.msg)}<span class="mini"> · étape ${RP.step + 1} / ${RP.steps.length}</span>${RP.step === RP.steps.length - 1 && RP.d ? ` · résultat héros <b class="${sgnCls(RP.d.net)}">${RP.d.net > 0 ? '+' : ''}${rpAmt(RP.d.net, ph.bb)}</b>${RP.d.adj ? ` · EV <b class="${sgnCls(RP.d.ev)}">${RP.d.ev > 0 ? '+' : ''}${rpAmt(Math.round(RP.d.ev), ph.bb)}</b>` : ''}` : ''}</div>`;
}

  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }
}
function shDownload(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function shFileName(ext) { const d = RP.d; const t = new Date(d ? d.ts : Date.now()); const z = (v) => String(v).padStart(2, '0'); return `main-${t.getFullYear()}${z(t.getMonth() + 1)}${z(t.getDate())}-${z(t.getHours())}${z(t.getMinutes())}${d && d.hc ? '-' + d.hc.map(c => intToCard(c)).join('') : ''}.${ext}`; }

  $('#rp_first').onclick = () => { rpStop(); rpGo(0); };
  $('#rp_last').onclick = () => { rpStop(); rpGo(RP.steps.length - 1); };
  $('#rp_prev').onclick = () => { rpStop(); rpGo(RP.step - 1); };
  $('#rp_next').onclick = () => { rpStop(); rpGo(RP.step + 1); };
  $('#rp_play').onclick = rpToggle;
  $('#rp_scrub').oninput = (e) => { rpStop(); rpGo(+e.target.value); };
  $('#rp_speed').onchange = (e) => { RP.speed = +e.target.value; if (RP.timer) { rpStop(); rpToggle(); } };
  $('#vw_copy').onclick = async (e) => { try { await navigator.clipboard.writeText($('#vw_txt').textContent); e.target.textContent = '✓ Copié'; } catch (er) { const r = document.createRange(); r.selectNodeContents($('#vw_txt')); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = 'Ctrl + C pour copier'; } };
  if (!vwLoad._keys) vwLoad._keys = true; else { drawTable(); vwFit(); setTimeout(() => { if (!RP.timer && RP.step === 0) rpToggle(); }, 700); return; }
  document.addEventListener('keydown', (e) => {
    if (!$('#rp_body')) return;
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { rpStop(); rpGo(RP.step + 1); } else if (e.key === 'ArrowLeft') { rpStop(); rpGo(RP.step - 1); } else if (e.key === ' ') { e.preventDefault(); rpToggle(); }
  });
  drawTable(); vwFit();
  setTimeout(() => { if (!RP.timer && RP.step === 0) rpToggle(); }, 700);
}
window.addEventListener('resize', vwFit);
window.addEventListener('hashchange', () => vwLoad(location.hash));
vwLoad(location.hash);

</script>
</body></html>
