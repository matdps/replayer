<style>

  --accent: #2fd1b8; --accent-ink: #062320; --accent-soft: rgba(47,209,184,.13);
  --a: #3ddc84; --b: #f2c14b; --c: #ff6b5e; --a-soft: rgba(61,220,132,.13); --b-soft: rgba(242,193,75,.14); --c-soft: rgba(255,107,94,.13);
  --blue: #6c9cff; --violet: #a98bff;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1211; --panel: #121c1a; --panel2: #172321; --line: #22312e; --line2: #2f413d;
  --text: #e8f0ed; --muted: #9db0aa; --dim: #6d807a;
  --accent: #2fd1b8; --accent-ink: #062320; --accent-soft: rgba(47,209,184,.13);

<script>
"use strict";
// =================== données ===================
const KEY = 'mental-edge-v1';
const blank = () => ({ v: 1, sessions: [], live: null, cool: null, axes: [], plan: { weekHours: 15, monthHours: 60, weekSessions: 5, sportTarget: 150, sleepTarget: 7.5, slots: [] }, days: {}, settings: { breakEvery: 50 }, demo: false });
let D; try { D = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { D = null; }
if (!D || !Array.isArray(D.sessions)) D = blank();
D = Object.assign(blank(), D); D.plan = Object.assign(blank().plan, D.plan || {}); D.settings = Object.assign(blank().settings, D.settings || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Impossible d’enregistrer : fais « Sauvegarder »'); } }

// =================== outils ===================
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 0) => (Number.isFinite(v) ? v : 0).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = (n) => String(n).padStart(2, '0');
const dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dkey(new Date());
const DOW = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'], DOWs = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const dowOf = (d) => (d.getDay() + 6) % 7;
const monday = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - dowOf(x)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDur = (min) => { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h${m ? ' ' + pad(m) : ''}` : `${m} min`; };
const fmtClock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
const fmtDate = (t, opt = { weekday: 'short', day: 'numeric', month: 'short' }) => new Date(t).toLocaleDateString('fr-FR', opt);
const hfmt = (x) => nf(x, x % 1 ? 1 : 0);
const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

// =================== listes de choix ===================
const TRIGGERS = ['Bad beat', 'Cooler', 'Downswing', 'Erreur de jeu', 'Adversaire / table', 'Fatigue', 'Distraction', 'Impatience', 'Autre'];
const MENTAL_GOALS = ['Rester calme après un bad beat', 'Respecter mes pauses', 'Rester concentré jusqu’au bout', 'Ne pas ajouter de tables en cours de route', 'Arrêter si je sens le tilt', 'Prendre mon temps sur les spots difficiles'];
const CATS = ['HU', '3 joueurs', 'BvB', 'Préflop', 'Postflop', 'Push / fold', 'Lecture adverse', 'Autre'];
const POSS = ['HU SB', 'HU BB', 'BTN', 'SB', 'BB', 'BvB SB vs BB', 'BvB BB vs SB', 'Toutes'];
const SITS = ['Préflop', 'Postflop', 'Limp pot', 'Pot relancé', 'Push / fold', 'Face à un jam', 'River', 'Autre'];
const STATUS = ['À travailler', 'En progression', 'Maîtrisé'];
const SPORTS = ['Musculation', 'Course', 'Vélo', 'Marche', 'Sport collectif', 'Natation', 'Yoga / étirements', 'Autre'];
const YN = [['yes', 'Oui'], ['mid', 'En partie'], ['no', 'Non']];

// =================== calculs ===================
// score mental 0-100 : objectif mental, tilt, concentration, pauses, niveau A/B/C (indépendant des résultats)
function mentalScore(s) {
  const c = s.cool || {}; let sc = 0;
  sc += { yes: 25, mid: 12, no: 0 }[c.goalOk] ?? 12;
  sc += { none: 25, some: 12, lot: 0 }[c.tilt] ?? 12;
  sc += ((c.focus || 3) - 1) / 4 * 25;
  sc += { yes: 10, mid: 5, no: 0 }[c.pauses] ?? 5;
  sc += { A: 15, B: 8, C: 0 }[s.game] ?? 8;
  sc -= Math.min(10, (s.tilts || []).length * 2);
  return Math.max(0, Math.min(100, Math.round(sc)));
}
function suggestGame(c, tilts) {
  const tiltN = (tilts || []).length;
  if (c.tilt === 'lot' || c.goalOk === 'no' && (c.focus || 3) <= 2 || tiltN >= 3) return 'C';
  if (c.tilt === 'none' && (c.focus || 3) >= 4 && c.goalOk === 'yes' && c.pauses !== 'no' && tiltN === 0) return 'A';
  return 'B';
}
const done = () => D.sessions.filter(s => s.cool);
const playMin = (s) => s.durMin || 0;
function weekSessions(ref = new Date()) { const m = monday(ref).getTime(), e = m + 7 * 864e5; return done().filter(s => s.start >= m && s.start < e); }
function monthSessions(ref = new Date()) { return done().filter(s => { const d = new Date(s.start); return d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear(); }); }
const axeById = (id) => D.axes.find(a => a.id === id);
const prioAxe = () => D.axes.find(a => a.prio && a.status !== 2) || D.axes.find(a => a.status !== 2) || null;
function nextSlot() { // prochaine session prévue dans la semaine type
  if (!D.plan.slots.length) return null; const now = new Date(); let best = null;
  for (const sl of D.plan.slots) { const [h, m] = sl.time.split(':').map(Number); for (let k = 0; k < 8; k++) { const d = addDays(monday(now), sl.dow + 7 * Math.floor(k / 7)); d.setHours(h, m, 0, 0); if (k >= 7) d.setDate(d.getDate() + 7); if (d.getTime() > now.getTime() - 30 * 60000) { if (!best || d < best.d) best = { d, sl }; break; } } }
  return best;
}
const dayLog = (k) => D.days[k] || null;

// =================== graphiques ===================
function lineChart(pts, opt = {}) { // pts: [{x(label), y, c(couleur)}]
  const W = 640, H = opt.h || 200, L = 34, R = 10, T = 10, B = 26, n = pts.length; if (!n) return '';
  const ymin = opt.min ?? 0, ymax = opt.max ?? 100, X = (i) => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), Y = (v) => T + (1 - (v - ymin) / (ymax - ymin)) * (H - T - B);
  let g = ''; for (const v of opt.ticks || [0, 25, 50, 75, 100]) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area = `${path} L${X(n - 1).toFixed(1)},${Y(ymin)} L${X(0).toFixed(1)},${Y(ymin)} Z`;
  const step = Math.max(1, Math.ceil(n / 8));
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Graphique')}">${g}<path d="${area}" fill="var(--accent-soft)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" fill="${p.c || 'var(--accent)'}" stroke="var(--panel)" stroke-width="2"><title>${esc(p.tip || p.y)}</title></circle>${i % step === 0 || i === n - 1 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(p.x)}</text>` : ''}`).join('')}</svg>`;
}
function hbars(items, color = 'var(--c)') { const mx = Math.max(1, ...items.map(i => i[1])); return `<div class="hbar">${items.map(([l, v, extra]) => `<div><span>${esc(l)}</span><span class="tr"><i style="width:${v / mx * 100}%;background:${color}"></i></span><b class="num">${extra ?? v}</b></div>`).join('')}</div>`; }
const gameColor = (g) => ({ A: 'var(--a)', B: 'var(--b)', C: 'var(--c)' }[g] || 'var(--accent)');

// =================== navigation ===================
const VIEWS = ['accueil', 'session', 'technique', 'planning', 'hygiene', 'journal'];
let VIEW = 'accueil', tick = null;
function show(v, push) {
  if (!VIEWS.includes(v)) v = 'accueil'; VIEW = v; clearInterval(tick); tick = null;
  $$('#nav [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const lb = $('#nav [data-v="session"]'); lb.innerHTML = D.live ? '<span class="live"></span>Session en cours' : D.cool ? 'Session · cooldown' : 'Session';
  if (push && location.hash.slice(1) !== v) { try { location.hash = v; } catch (e) { /* lien non modifiable */ } }
  ({ accueil: vHome, session: vSession, technique: vTech, planning: vPlan, hygiene: vHyg, journal: vJournal })[v]();
  window.scrollTo({ top: 0 });
}
$$('#nav [data-v]').forEach(b => b.onclick = () => show(b.dataset.v, true));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== VIEW) show(h); });

// =================== ACCUEIL ===================
function vHome() {
  const S = done(), last = S.slice(-20), wk = weekSessions(), mo = monthSessions(), wkMin = wk.reduce((a, s) => a + playMin(s), 0), moMin = mo.reduce((a, s) => a + playMin(s), 0);
  const scores = S.map(mentalScore), last10 = scores.slice(-10), prev10 = scores.slice(-20, -10), m10 = avg(last10), p10 = avg(prev10);
  const cnt = { A: 0, B: 0, C: 0 }; S.forEach(s => cnt[s.game] = (cnt[s.game] || 0) + 1); const tot = S.length || 1;
  const nx = nextSlot(), ax = prioAxe();
  const trig = {}; S.forEach(s => (s.tilts || []).forEach(t => trig[t.trig] = (trig[t.trig] || 0) + 1));
  const probs = []; if (S.length) { const pct = (f) => Math.round(S.filter(f).length / S.length * 100);
    probs.push(['Pauses pas respectées', pct(s => s.cool.pauses === 'no' || s.cool.pauses === 'mid')], ['Objectif mental raté', pct(s => s.cool.goalOk === 'no')], ['Concentration faible', pct(s => (s.cool.focus || 3) <= 2)], ['Tilt ressenti', pct(s => s.cool.tilt !== 'none')]); probs.sort((a, b) => b[1] - a[1]); }
  // hygiène 7 jours
  const days = [...Array(7)].map((_, i) => dkey(addDays(new Date(), i - 6))), logs = days.map(dayLog);
  const sl = logs.filter(l => l && l.sleepH).map(l => l.sleepH), sportMin = logs.reduce((a, l) => a + (l && l.sport ? l.sport.reduce((x, s) => x + (+s.min || 0), 0) : 0), 0);
  const hello = new Date().getHours() < 12 ? 'Bonjour' : new Date().getHours() < 18 ? 'Bon après-midi' : 'Bonsoir';
  $('#main').innerHTML = `
  <div class="grid" style="gap:16px">
    <section class="card" style="display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div><h2 style="font:800 22px var(--f-display)">${hello} 👋</h2><div class="hint" style="font-size:13.5px;margin-top:3px">${D.live ? 'Une session est en cours.' : nx ? `Prochaine session prévue : <b>${fmtDate(nx.d, { weekday: 'long', day: 'numeric', month: 'long' })} à ${nx.sl.time}</b> (${fmtDur(nx.sl.dur)})` : 'Aucune session prévue : remplis ta semaine type dans Planning.'}</div></div>
      <div class="row"><button class="btn" id="hGo">${D.live ? 'Reprendre la session' : D.cool ? 'Finir le cooldown' : 'Commencer une session'}</button>${!S.length && !D.demo ? '<button class="ghost" id="hDemo">Voir avec des données d’exemple</button>' : ''}${D.demo ? '<button class="ghost danger" id="hDemoOff">Effacer l’exemple</button>' : ''}</div>
    </section>
    <div class="grid g4">
      <section class="card kpi"><div class="lbl">Sessions</div><div class="v num">${S.length}</div><div class="s">dont <b>${wk.length}</b> cette semaine (objectif ${D.plan.weekSessions})</div></section>
      <section class="card kpi"><div class="lbl">Grind de la semaine</div><div class="v num">${fmtDur(wkMin)}</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100, wkMin / (D.plan.weekHours * 60) * 100)}%"></i></div><div class="s">objectif ${D.plan.weekHours} h · mois ${nf(moMin / 60, 1)} / ${D.plan.monthHours} h</div></section>
      <section class="card kpi"><div class="lbl">Score mental moyen</div><div class="v num">${m10 === null ? '–' : nf(m10)}<span style="font-size:15px;color:var(--dim)"> /100</span></div><div class="s">${m10 === null ? 'après ta première session' : p10 === null ? 'sur tes 10 dernières sessions' : `${m10 >= p10 ? '▲' : '▼'} ${nf(Math.abs(m10 - p10))} pts vs les 10 d’avant`}</div></section>
      <section class="card kpi"><div class="lbl">A / B / C Game</div><div class="row" style="margin-top:8px;gap:6px"><span class="pill gA">A ${Math.round(cnt.A / tot * 100)} %</span><span class="pill gB">B ${Math.round(cnt.B / tot * 100)} %</span><span class="pill gC">C ${Math.round(cnt.C / tot * 100)} %</span></div><div class="abcbar"><i style="width:${cnt.A / tot * 100}%;background:var(--a)"></i><i style="width:${cnt.B / tot * 100}%;background:var(--b)"></i><i style="width:${cnt.C / tot * 100}%;background:var(--c)"></i></div></section>
    </div>
    <div class="grid g21">
      <section class="card"><div class="hd"><h3>Évolution de ton mental</h3><span class="hint">20 dernières sessions · point = A / B / C</span></div>
        ${last.length ? lineChart(last.map(s => ({ x: fmtDate(s.start, { day: 'numeric', month: 'numeric' }), y: mentalScore(s), c: gameColor(s.game), tip: `${fmtDate(s.start)} · ${s.game} Game · ${mentalScore(s)}/100` })), { label: 'Score mental par session' }) + `<div class="legend"><span><i style="background:var(--a)"></i>A Game</span><span><i style="background:var(--b)"></i>B Game</span><span><i style="background:var(--c)"></i>C Game</span></div>` : '<div class="empty">Ton évolution apparaîtra ici après tes premières sessions.</div>'}</section>
      <section class="card"><div class="hd"><h3>Axe technique prioritaire</h3><button class="ghost sm" data-go="technique">Gérer</button></div>
        ${ax ? axeSummary(ax) : '<div class="empty">Crée ton premier axe de travail dans l’onglet Technique.</div>'}</section>
    </div>
    <div class="grid g3">
      <section class="card"><div class="hd"><h3>Déclencheurs de tilt</h3></div>${Object.keys(trig).length ? hbars(Object.entries(trig).sort((a, b) => b[1] - a[1]).slice(0, 6)) : '<div class="hint">Aucun tilt noté. Pendant la session, appuie sur « Tilt » dès que tu le sens monter.</div>'}</section>
      <section class="card"><div class="hd"><h3>Problèmes les plus fréquents</h3></div>${probs.length ? hbars(probs.map(([l, v]) => [l, v, v + ' %']), 'var(--b)') : '<div class="hint">Se remplit avec tes cooldowns.</div>'}</section>
      <section class="card"><div class="hd"><h3>Hors table · 7 jours</h3><button class="ghost sm" data-go="hygiene">Remplir</button></div>
        <div class="kv"><div><span>Sommeil moyen</span><b class="num">${sl.length ? nf(avg(sl), 1) + ' h' : '–'} <small class="hint">/ ${hfmt(D.plan.sleepTarget)} h</small></b></div><div><span>Sport</span><b class="num">${fmtDur(sportMin)} <small class="hint">/ ${fmtDur(D.plan.sportTarget)}</small></b></div><div><span>Énergie moyenne</span><b class="num">${(() => { const e = logs.filter(l => l && l.energy).map(l => l.energy); return e.length ? nf(avg(e), 1) + ' / 5' : '–'; })()}</b></div><div><span>Jours remplis</span><b class="num">${logs.filter(Boolean).length} / 7</b></div></div></section>
    </div>
    <section class="card"><div class="hd"><h3>Ce que disent tes données</h3><span class="hint">Les liens entre ta vie hors table et ton mental</span></div>${insights()}</section>
  </div>`;
  $('#hGo').onclick = () => show('session', true);
  if ($('#hDemo')) $('#hDemo').onclick = () => { loadDemo(); show('accueil'); toast('Exemple chargé : explore les onglets'); };
  if ($('#hDemoOff')) $('#hDemoOff').onclick = () => { if (!confirmBtn($('#hDemoOff'), 'Confirmer : tout effacer')) return; D = blank(); save(); show('accueil'); toast('Exemple effacé'); };
  $$('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go, true));
}
function confirmBtn(b, txt) { if (b.dataset.arm === '1') return true; b.dataset.arm = '1'; b.dataset.old = b.textContent; b.textContent = txt; setTimeout(() => { if (b.isConnected) { b.dataset.arm = ''; b.textContent = b.dataset.old; } }, 4000); return false; }
function insights() {
  const S = done().map(s => ({ s, sc: mentalScore(s), log: dayLog(dkey(new Date(s.start))), prev: dayLog(dkey(addDays(new Date(s.start), -1))) })), out = [];
  const cmp = (label, inA, la, lb, icon) => { const A = S.filter(inA), B = S.filter(x => !inA(x)); if (A.length < 3 || B.length < 3) return; const a = avg(A.map(x => x.sc)), b = avg(B.map(x => x.sc)), d = a - b; if (Math.abs(d) < 3) return; out.push(`<div class="insight"><span class="ic">${icon}</span><div><b>${esc(label)}</b> : ton score mental moyen est de <b>${nf(a)}</b> ${esc(la)}, contre <b>${nf(b)}</b> ${esc(lb)} (${d > 0 ? '+' : '−'}${nf(Math.abs(d))} pts).</div></div>`); };
  const sleepOf = (x) => (x.log && x.log.sleepH) || null;
  cmp('Sommeil', x => sleepOf(x) !== null && sleepOf(x) >= D.plan.sleepTarget, `quand tu as dormi au moins ${hfmt(D.plan.sleepTarget)} h`, 'les autres jours', '☾');
  cmp('Sport', x => !!(x.log && x.log.sport && x.log.sport.length) || !!(x.prev && x.prev.sport && x.prev.sport.length), 'les jours où tu as fait du sport (ou la veille)', 'sans sport', '⚡');
  cmp('Fatigue au warm-up', x => (x.s.warm.fatigue || 3) >= 4, 'quand tu démarres fatigué (4-5/5)', 'quand tu es en forme', '◔');
  cmp('Heure de début', x => new Date(x.s.start).getHours() >= 22 || new Date(x.s.start).getHours() < 5, 'pour les sessions commencées après 22 h', 'pour les autres', '◷');
  cmp('Durée', x => playMin(x.s) > 180, 'pour les sessions de plus de 3 h', 'pour les plus courtes', '⧗');
  cmp('Écrans', x => !!(x.prev && x.prev.screens), 'après une soirée d’écrans au coucher', 'sinon', '▭');
  return out.length ? out.join('') : '<div class="hint">Il faut au moins 3 sessions dans chaque cas pour comparer. Remplis ton hygiène de vie chaque jour : les tendances apparaîtront ici (sommeil, sport, fatigue, heure de jeu, durée…).</div>';
}
function axeSummary(a) {
  const H = D.sessions.filter(s => s.cool && s.warm.axeId === a.id), ok = H.filter(s => s.cool.applied === 'yes').length;
  return `<div class="axe ${a.prio ? 'prio' : ''}" style="border:0;padding:0;box-shadow:none"><div class="tags"><span class="pill">${esc(a.cat)}</span><span class="pill">${esc(a.pos)}</span><span class="pill">${esc(a.sit)}</span><span class="pill st${a.status}">${STATUS[a.status]}</span></div>
    <div style="font:700 17px/1.35 var(--f-display)">${esc(a.point)}</div>${a.goal ? `<div class="hint">Objectif : ${esc(a.goal)}</div>` : ''}
    <div class="kv"><div><span>Sessions travaillées</span><b class="num">${H.length}</b></div><div><span>Appliqué correctement</span><b class="num">${H.length ? Math.round(ok / H.length * 100) + ' %' : '–'}</b></div></div></div>`;
}

// =================== SESSION ===================
function vSession() { if (D.live) return vLive(); if (D.cool) return vCool(); vWarm(); }
const W = { mental: null, fatigue: null, focus: null, motiv: null, goalMental: '', axeId: null, plannedMin: 120 };
function scaleHTML(id, lo, hi) { return `<div class="scale" data-scale="${id}">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-v="${v}" class="${W[id] === v ? 'on' : ''}">${v}<small>${v === 1 ? lo : v === 5 ? hi : ''}</small></button>`).join('')}</div>`; }
function vWarm() {
  const ax = prioAxe(); if (W.axeId === null && ax) W.axeId = ax.id;
  const nx = nextSlot(); if (nx && W._planSet !== true) { W.plannedMin = nx.sl.dur; W._planSet = true; }
  const lastNight = dayLog(today()) || dayLog(dkey(addDays(new Date(), -1)));
  $('#main').innerHTML = `<div class="grid g21">
    <section class="card"><div class="steps"><span class="on">1 · Warm-up</span><i></i><span>2 · Session</span><i></i><span>3 · Cooldown</span></div>
      <h2 style="font:800 22px var(--f-display);margin:10px 0 2px">Warm-up</h2><div class="hint">2 minutes pour démarrer dans le bon état d’esprit.</div>
      <div class="q"><span class="ql">Mon état mental</span>${scaleHTML('mental', 'mauvais', 'excellent')}</div>
      <div class="q"><span class="ql">Mon niveau de fatigue</span>${scaleHTML('fatigue', 'reposé', 'épuisé')}</div>
      <div class="q"><span class="ql">Mon niveau de concentration</span>${scaleHTML('focus', 'dispersé', 'à fond')}</div>
      <div class="q"><span class="ql">Ma motivation</span>${scaleHTML('motiv', 'aucune', 'énorme')}</div>
      <div class="q"><label for="wGoal">Mon objectif mental de la session</label><div class="chips" id="wGoalChips">${MENTAL_GOALS.map(g => `<button type="button" class="${W.goalMental === g ? 'on' : ''}">${esc(g)}</button>`).join('')}</div><input class="inp" id="wGoal" placeholder="Ou écris le tien…" value="${esc(W.goalMental)}"></div>
      <div class="q"><label for="wAxe">Mon objectif technique (axe à travailler)</label>
        ${D.axes.filter(a => a.status !== 2).length ? `<select class="inp" id="wAxe"><option value="">— aucun pour cette session —</option>${D.axes.filter(a => a.status !== 2).map(a => `<option value="${a.id}" ${W.axeId === a.id ? 'selected' : ''}>${a.prio ? '★ ' : ''}${esc(a.cat)} · ${esc(a.pos)} · ${esc(a.point)}</option>`).join('')}</select>` : `<div class="hint">Pas encore d’axe technique. <button class="ghost sm" data-go="technique">Créer un axe</button></div>`}</div>
      <div class="q"><label for="wDur">Durée prévue</label><div class="row"><div class="chips" id="wDurChips">${[60, 90, 120, 180, 240].map(m => `<button type="button" data-m="${m}" class="${W.plannedMin === m ? 'on' : ''}">${fmtDur(m)}</button>`).join('')}</div><input class="inp" id="wDur" type="number" min="10" step="10" value="${W.plannedMin}" style="width:90px"> <span class="hint">min · pause toutes les</span><input class="inp" id="wBreak" type="number" min="10" step="5" value="${D.settings.breakEvery}" style="width:70px"><span class="hint">min</span></div></div>
      <div style="margin-top:12px"><button class="btn big" id="wGo">Lancer la session</button><div class="hint" id="wMiss" style="text-align:center;margin-top:6px"></div></div>
    </section>
    <div class="grid" style="align-content:start">
      ${W.fatigue >= 4 || (lastNight && lastNight.sleepH && lastNight.sleepH < D.plan.sleepTarget - 1) ? `<section class="card" style="border-color:var(--b)"><h3>⚠ Attention à la fatigue</h3><p class="hint" style="margin-top:6px">${lastNight && lastNight.sleepH ? `Tu as dormi ${nf(lastNight.sleepH, 1)} h. ` : ''}Pense à une session plus courte, avec moins de tables et des pauses plus fréquentes.</p></section>` : ''}
      <section class="card"><h3>Routine avant de jouer</h3><div class="list" style="margin-top:8px">${['Téléphone loin, notifications coupées', 'Une bouteille d’eau à côté', '2 minutes de respiration (4 s inspire, 6 s expire)', 'Relire mes notes d’étude sur mon axe', 'Je décide quand j’arrête (durée ou stop-loss)'].map((t, i) => `<label class="chk row" style="cursor:pointer"><input type="checkbox" style="accent-color:var(--accent);width:17px;height:17px"> ${esc(t)}</label>`).join('')}</div></section>
      ${W.axeId && axeById(W.axeId) ? `<section class="card"><h3>Ton axe du jour</h3><div style="margin-top:8px">${axeSummary(axeById(W.axeId))}</div>${(axeById(W.axeId).notes || []).slice(-2).map(n => `<div class="item" style="margin-top:8px"><span class="hint">${fmtDate(n.d)}</span>${esc(n.txt)}</div>`).join('')}</section>` : ''}
    </div></div>`;
  $$('[data-scale]').forEach(sc => $$('button', sc).forEach(b => b.onclick = () => { W[sc.dataset.scale] = +b.dataset.v; $$('button', sc).forEach(x => x.classList.toggle('on', x === b)); if (sc.dataset.scale === 'fatigue') vWarm(); }));
  $$('#wGoalChips button').forEach(b => b.onclick = () => { W.goalMental = b.textContent; $('#wGoal').value = W.goalMental; $$('#wGoalChips button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#wGoal').oninput = (e) => { W.goalMental = e.target.value; $$('#wGoalChips button').forEach(x => x.classList.toggle('on', x.textContent === W.goalMental)); };
  if ($('#wAxe')) $('#wAxe').onchange = (e) => { W.axeId = e.target.value || ''; vWarm(); };
  $$('#wDurChips button').forEach(b => b.onclick = () => { W.plannedMin = +b.dataset.m; $('#wDur').value = W.plannedMin; $$('#wDurChips button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#wDur').oninput = (e) => { W.plannedMin = Math.max(10, +e.target.value || 120); };
  $('#wBreak').oninput = (e) => { D.settings.breakEvery = Math.max(10, +e.target.value || 50); save(); };
  $$('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go, true));
  $('#wGo').onclick = () => {
    const miss = ['mental', 'fatigue', 'focus', 'motiv'].filter(k => !W[k]); if (miss.length) { $('#wMiss').textContent = 'Réponds aux 4 échelles avant de lancer.'; return; }
    D.live = { id: uid(), start: Date.now(), pauses: [], paused: null, tilts: [], warm: { mental: W.mental, fatigue: W.fatigue, focus: W.focus, motiv: W.motiv, goalMental: W.goalMental.trim(), axeId: W.axeId || null, plannedMin: W.plannedMin } };
    save(); Object.assign(W, { mental: null, fatigue: null, focus: null, motiv: null, goalMental: '', axeId: null, _planSet: false }); show('session');

$('#bkExport').onclick = () => { const txt = JSON.stringify(D), name = `mental-edge-${today()}.json`; try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 500); toast('Sauvegarde créée : ' + name); } catch (e) { toast('Téléchargement bloqué ici'); } };
$('#bkImport').onclick = () => $('#bkFile').click();
$('#bkFile').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!Array.isArray(o.sessions)) throw 0; D = Object.assign(blank(), o); save(); show('accueil'); toast('Données importées'); } catch (err) { toast('Ce fichier n’est pas une sauvegarde Mental Edge'); } }; rd.readAsText(f); e.target.value = ''; };

const h0 = location.hash.slice(1);
show(VIEWS.includes(h0) ? h0 : (D.live ? 'session' : 'accueil'));
</script>
</body></html>
